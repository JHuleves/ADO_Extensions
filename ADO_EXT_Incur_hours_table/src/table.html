<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Time Tracking Table</title>
    <script src="VSS.SDK.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 10px; 
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; 
            background-color: white; 
            color: #333; 
        }
        .toolbar {
            margin-bottom: 10px;
        }
        #delete-btn {
            background-color: #d13438;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 2px;
        }
        #delete-btn:hover {
            background-color: #a4262c;
        }
        #delete-btn:disabled {
            background-color: #f3f2f1;
            color: #a19f9d;
            cursor: default;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            text-align: left;
            background-color: #f3f2f1;
            padding: 8px;
            border-bottom: 1px solid #edebe9;
        }
        td {
            padding: 8px;
            border-bottom: 1px solid #edebe9;
        }
        tr:hover {
            background-color: #f8f8f8;
        }
        .center-text {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="delete-btn" disabled>Delete Selected</button>
    </div>
    <div id="table-container">
        <table id="time-table">
            <thead>
                <tr>
                    <th style="width: 30px;"></th>
                    <th>Name</th>
                    <th>Date</th>
                    <th>Hours</th>
                    <th class="center-text">Incurred</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Rows will be injected here -->
            </tbody>
        </table>
    </div>
    <script>
        VSS.init({
            explicitNotifyLoaded: true,
            usePlatformScripts: true,
            usePlatformStyles: true
        });

        VSS.require(["table"], function (table) {
            // Logic handled in table.js
        });
    </script>
</body>
</html>
